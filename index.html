<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_NAME%: King's Quest-style scenes painted from code</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="theme-color" content="#000000" />

    <!-- link previews (Open Graph for Facebook, LinkedIn and most others; X has its own tags). The
         images come from `pnpm social`; their URLs carry a hash of the file, so a new image gets a
         new URL and the platforms' caches fetch it. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:title" content="%APP_NAME%: King's Quest-style scenes painted from code" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:secure_url" content="%OG_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Paint Quest title screen: a ribbon banner reading PAINT QUEST above a black scroll, with yellow and green vines in the lower corners, in 16-colour EGA pixel art." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="%X_HANDLE%" />
    <meta name="twitter:creator" content="%X_HANDLE%" />
    <meta name="twitter:title" content="%APP_NAME%: King's Quest-style scenes painted from code" />
    <meta name="twitter:description" content="%APP_DESCRIPTION%" />
    <meta name="twitter:image" content="%X_IMAGE%" />
    <meta name="twitter:image:alt" content="The Paint Quest title screen: a ribbon banner reading PAINT QUEST above a black scroll, with yellow and green vines in the lower corners, in 16-colour EGA pixel art." />
    <script type="application/ld+json">%JSON_LD%</script>

    <!-- icons (from `pnpm social`): SVG for current browsers, ICO for the rest, PNGs for home screens -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 256x256" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- linked here (not imported from main.ts) so the page is styled before the large script loads -->
    <link rel="stylesheet" href="/src/app/style.css" />
    <!-- the IBM PC fonts the whole page is set in: fetched up front so text never swaps in late -->
    <link rel="preload" href="/fonts/Px437_IBM_VGA8.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Px437_IBM_BIOS.ttf" as="font" type="font/ttf" crossorigin />
    <noscript><style>#boot-status { display: none; }</style></noscript>
    <script>
      // Show nothing until the fonts are in, so text never reflows when they swap in (at most 3 s).
      document.documentElement.classList.add('fonts-loading');
      Promise.race([
        Promise.all(['16px "IBM VGA"', '16px "IBM BIOS"'].map((f) => document.fonts.load(f))),
        new Promise((r) => setTimeout(r, 3000)),
      ]).finally(() => document.documentElement.classList.remove('fonts-loading'));
      // reserve the compare panel before the app script arrives if the URL asks for it
      if (/[?&]compare=1(&|$)/.test(location.hash)) document.documentElement.classList.add('boot-compare');
      // if the app script fails to load or throws while booting, say so instead of "Loading…" forever
      addEventListener('error', (e) => {
        const status = document.getElementById('boot-status');
        if (!status || !document.body.classList.contains('booting')) return;
        if (e instanceof ErrorEvent) status.textContent = `Couldn't start the viewer: ${e.message}`;
        else if (e.target instanceof HTMLScriptElement) status.textContent = "Couldn't load the viewer - try reloading the page.";
        else return;
        status.classList.add('error');
      }, true);
    </script>
  </head>
  <body class="booting">
    <header>
      <h1>%APP_NAME%</h1>
      <span id="where"></span>
      <button id="welcome-open" title="Show the title screen again">Intro</button>
    </header>
    <p class="tagline">Sierra AGI-style scenes painted live from PicScript drawing instructions</p>
    <main id="app" aria-busy="true">
      <section class="viewer">
        <div class="toolbar">
          <span class="group nav">
            <button id="prev" class="icon" title="Previous scene (←)" aria-label="Previous scene">←</button>
            <select id="scene-select" aria-label="Scene"></select>
            <button id="next" class="icon" title="Next scene (→)" aria-label="Next scene">→</button>
          </span>
          <span class="group playback">
            <!-- phones get a dropdown in place of the speed buttons (style.css) -->
            <select id="speed-select" aria-label="Playback speed">
              <option value="paint">speed: paint</option>
              <option value="fast">speed: fast</option>
              <option value="instant">speed: instant</option>
            </select>
            <span id="speeds" class="seg" aria-label="Playback speed">
              <button data-speed="paint" aria-pressed="false">paint</button>
              <button data-speed="fast" aria-pressed="false">fast</button>
              <button data-speed="instant" aria-pressed="false">instant</button>
            </span>
            <!-- the transport, in the PC's own character set: to the start, one instruction back,
                 play/pause, one instruction on, to the end (phones keep the start, play and +1) -->
            <span class="actions" role="group" aria-label="Playback">
              <button id="start" class="icon" title="Back to the start (Home)" aria-label="Back to the start" aria-keyshortcuts="Home">▐◄</button>
              <button id="back" class="icon" title="One instruction back (,)" aria-label="One instruction back" aria-keyshortcuts=",">-1</button>
              <button id="pause" class="icon" title="Pause (p / space)" aria-label="Pause" aria-keyshortcuts="p Space">▌▐</button>
              <button id="step" class="icon" title="One more instruction (s or .)" aria-label="One more instruction" aria-keyshortcuts="s .">+1</button>
              <button id="end" class="icon" title="Skip to the end (End)" aria-label="Skip to the end" aria-keyshortcuts="End">►▌</button>
            </span>
          </span>
          <span class="group view">
            <label class="check"><input type="checkbox" id="compare-toggle" /> compare</label>
            <span id="variants" class="seg" aria-label="Variant"></span>
          </span>
        </div>
        <div id="stage" tabindex="-1" aria-label="Scene">
          <p id="boot-status" role="status">Loading scenes…</p>
          <img id="original" alt="The original picture" hidden />
          <button id="rasterize" hidden><span class="pointer-word">Click</span><span class="touch-word">Tap</span> to paint it</button>
          <noscript><p id="noscript">This viewer needs JavaScript to paint its scenes.</p></noscript>
        </div>
        <div class="status">
          <span id="title"></span>
          <!-- phones show compare here, beside the title, instead of in the toolbar (style.css) -->
          <label class="check" id="status-compare"><input type="checkbox" id="compare-toggle-status" /> compare</label>
          <span id="progress"></span>
          <span id="stats"></span>
        </div>
        <div id="compare" hidden>
          <figure><canvas id="cmp-original" width="320" height="168"></canvas><figcaption>original</figcaption></figure>
          <figure><canvas id="cmp-rendered" width="320" height="168"></canvas><figcaption>rendered</figcaption></figure>
          <figure><canvas id="cmp-diff" width="320" height="168"></canvas><figcaption id="cmp-score">diff</figcaption></figure>
        </div>
      </section>
      <aside class="source">
        <div class="source-head">
          <span id="source-path"></span>
          <button id="edit">edit</button>
          <button id="run" hidden>run ▸</button>
        </div>
        <pre id="source" tabindex="0"></pre>
        <textarea id="editor" spellcheck="false" hidden></textarea>
        <div id="messages"></div>
      </aside>
    </main>
    <section id="gallery" aria-label="Scene gallery"></section>
    <footer>Created by <a href="https://mordenstar.com/projects" target="_blank" rel="noopener">Shaun Pedicini</a></footer>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
